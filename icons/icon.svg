<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dumbbell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background con esquinas suavemente redondeadas estilo iOS/Android adaptive -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Glow sutil detrás de la pesa -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.08"/>

  <!-- Pesa horizontal centrada -->
  <g transform="translate(256, 256)">
    <!-- Disco izquierdo grande -->
    <rect x="-180" y="-70" width="40" height="140" rx="8" fill="url(#dumbbell)"/>
    <!-- Disco izquierdo chico -->
    <rect x="-130" y="-50" width="24" height="100" rx="5" fill="url(#dumbbell)" opacity="0.85"/>

    <!-- Barra central -->
    <rect x="-106" y="-14" width="212" height="28" rx="4" fill="#cbd5e1"/>
    <!-- Brillo en la barra -->
    <rect x="-106" y="-14" width="212" height="6" rx="2" fill="#f1f5f9" opacity="0.6"/>

    <!-- Disco derecho chico -->
    <rect x="106" y="-50" width="24" height="100" rx="5" fill="url(#dumbbell)" opacity="0.85"/>
    <!-- Disco derecho grande -->
    <rect x="140" y="-70" width="40" height="140" rx="8" fill="url(#dumbbell)"/>
  </g>

  <!-- Acento verde abajo (color "done" de la app) -->
  <rect x="176" y="430" width="160" height="6" rx="3" fill="url(#accent)"/>
</svg>
