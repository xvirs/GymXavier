<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tracker personal de rutina de gimnasio con seguimiento de pesos por serie, timer de descanso, progreso semanal y reset automático.">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GymPro">
    <meta name="theme-color" content="#0f172a">

    <!-- Open Graph -->
    <meta property="og:title" content="Gym Pro Tracker">
    <meta property="og:description" content="Tracker personal de rutina con seguimiento de pesos y progreso semanal.">
    <meta property="og:type" content="website">

    <!-- Manifest e iconos -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <title>Gym Pro Tracker - Xavier</title>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --subtext: #94a3b8;
            --done: #10b981;
            --push: #f87171;
            --pull: #60a5fa;
            --legs: #fbbf24;
            --sculpt: #a78bfa;
            --cardio: #ec4899;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0 0 90px 0;
            line-height: 1.5;
        }

        .container { padding: 16px 15px 0 15px; }

        /* Top bar (sticky) */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top, 12px));
            background: rgba(15, 23, 42, 0.78);
            -webkit-backdrop-filter: saturate(160%) blur(14px);
            backdrop-filter: saturate(160%) blur(14px);
        }
        .topbar-progress-track {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: rgba(56,189,248,0.12);
            overflow: hidden;
        }
        .topbar-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--done));
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .topbar-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-size: 1rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .topbar-title-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 0 8px rgba(56,189,248,0.45));
        }

        /* Profile card */
        .profile-card {
            background: linear-gradient(135deg, rgba(56,189,248,0.10), rgba(167,139,250,0.05));
            border: 1px solid rgba(56,189,248,0.18);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 20px;
        }
        .profile-stats {
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }
        .profile-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
            min-width: 0;
        }
        .stat-label {
            font-size: 0.65rem;
            color: var(--subtext);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }
        .stat-value {
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 800;
            white-space: nowrap;
        }
        .week-info {
            text-align: center;
            color: var(--subtext);
            font-size: 0.78rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 10px;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        /* "HOY" badge for current weekday */
        .today-badge {
            display: inline-block;
            background: var(--accent);
            color: #0f172a;
            font-size: 0.62rem;
            font-weight: 900;
            padding: 3px 7px;
            border-radius: 6px;
            margin-right: 8px;
            letter-spacing: 1.2px;
            vertical-align: 2px;
        }

        .day-section {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .day-title { font-weight: 800; font-size: 1.2rem; }
        .day-progress {
            font-size: 0.85rem;
            color: var(--subtext);
            background: rgba(255,255,255,0.06);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
        }
        .day-progress.complete { background: rgba(16,185,129,0.18); color: var(--done); }

        .lunes { border-left: 6px solid var(--push); }
        .lunes .day-title { color: var(--push); }
        .martes { border-left: 6px solid var(--pull); }
        .martes .day-title { color: var(--pull); }
        .miercoles { border-left: 6px solid var(--legs); }
        .miercoles .day-title { color: var(--legs); }
        .jueves { border-left: 6px solid var(--sculpt); }
        .jueves .day-title { color: var(--sculpt); }
        .cardio-section { border-left: 6px solid var(--cardio); }
        .cardio-section .day-title { color: var(--cardio); }

        .day-section.today { box-shadow: 0 0 0 2px var(--accent), 0 4px 20px rgba(0,0,0,0.3); }

        .exercise-item {
            background: rgba(255,255,255,0.04);
            margin-bottom: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            transition: opacity 0.35s ease, border-color 0.3s ease, transform 0.25s ease;
            border: 1px solid transparent;
        }

        .exercise-item.checked {
            opacity: 0.55;
            border-color: var(--done);
            transform: scale(0.985);
        }
        .exercise-item.just-checked {
            animation: justChecked 0.7s ease-out;
        }
        @keyframes justChecked {
            0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.55); }
            60%  { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

        .check-row { display: flex; align-items: center; gap: 8px; }

        .check-label {
            display: flex;
            align-items: center;
            flex-grow: 1;
            cursor: pointer;
            min-height: 36px;
        }

        input[type="checkbox"] {
            width: 26px;
            height: 26px;
            margin-right: 12px;
            accent-color: var(--done);
            cursor: pointer;
            flex-shrink: 0;
        }

        .ex-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent);
        }

        .ex-search {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(56,189,248,0.15);
            color: var(--accent);
            text-decoration: none;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .ex-search:active { background: rgba(56,189,248,0.3); }

        .exercise-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            margin-left: 38px;
        }

        .details {
            background: rgba(0,0,0,0.25);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .btn-expand {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: none;
            width: 36px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-expand:active { background: rgba(255,255,255,0.12); }

        .exercise-detail {
            margin-top: 12px;
            margin-left: 38px;
            padding: 12px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
        }

        .last-record {
            font-size: 0.85rem;
            color: var(--subtext);
            margin-bottom: 10px;
        }
        .last-record strong { color: var(--legs); }

        .series-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

        .series-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .series-label {
            font-weight: 700;
            color: var(--subtext);
            font-size: 0.85rem;
            width: 28px;
            flex-shrink: 0;
        }

        .series-row input[type="number"] {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
        }
        .series-row input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.1);
        }
        .series-row input::-webkit-outer-spin-button,
        .series-row input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .series-row input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

        .series-x { color: var(--subtext); font-weight: 700; }

        .btn-rest {
            width: 100%;
            background: rgba(56,189,248,0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .btn-rest:active { background: rgba(56,189,248,0.3); }

        .cardio-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
        }
        .cardio-table th, .cardio-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .cardio-table th { background: #0f172a; color: var(--cardio); font-weight: 800; }
        .cardio-table td { background: rgba(255,255,255,0.02); }

        .btn-reset {
            background: rgba(239,68,68,0.15);
            color: var(--danger);
            border: 1px solid rgba(239,68,68,0.35);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .btn-reset:active { background: rgba(239,68,68,0.3); transform: scale(0.96); }

        .hidden { display: none !important; }

        /* Floating rest timer pill */
        .rest-pill {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 50px;
            padding: 8px 10px 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 150;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-weight: 800;
            color: var(--text);
            max-width: calc(100vw - 30px);
            animation: pillIn 0.25s ease-out;
        }
        @keyframes pillIn {
            from { opacity: 0; transform: translate(-50%, 12px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }
        .rest-icon { font-size: 1.1rem; }
        .rest-time-pill {
            font-size: 1.3rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            min-width: 56px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .rest-btn {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border: none;
            height: 34px;
            padding: 0 10px;
            border-radius: 17px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .rest-btn:active { background: rgba(255,255,255,0.18); }
        .rest-cancel {
            background: rgba(239,68,68,0.18);
            color: var(--danger);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .rest-cancel:active { background: rgba(239,68,68,0.35); }
        .rest-pill.done {
            background: var(--done);
            border-color: var(--done);
            animation: pulse 0.6s ease-in-out infinite;
        }
        .rest-pill.done .rest-time-pill { color: #fff; }
        .rest-pill.done .rest-btn,
        .rest-pill.done .rest-cancel {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
        @keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
    </style>
</head>
<body>
    <header class="topbar">
        <h1 class="topbar-title">
            <span class="topbar-title-icon" aria-hidden="true">🏋</span>
            <span>Gym Pro</span>
        </h1>
        <button class="btn-reset" id="btn-reset" type="button">
            <span aria-hidden="true">🔄</span>
            <span>Reset</span>
        </button>
        <div class="topbar-progress-track" aria-hidden="true">
            <div class="topbar-progress-fill" id="topbar-progress"></div>
        </div>
    </header>

    <main class="container">
        <section class="profile-card">
            <div class="profile-stats">
                <div class="profile-stat">
                    <span class="stat-label">Altura</span>
                    <span class="stat-value">1.75m</span>
                </div>
                <div class="profile-stat">
                    <span class="stat-label">Peso</span>
                    <span class="stat-value">83kg</span>
                </div>
                <div class="profile-stat">
                    <span class="stat-label">Meta</span>
                    <span class="stat-value">Definición</span>
                </div>
            </div>
            <div class="week-info" id="week-info"></div>
        </section>

        <div id="routine-container"></div>
    </main>

    <div id="rest-pill" class="rest-pill hidden" role="status" aria-live="polite" aria-label="Timer de descanso">
        <span class="rest-icon" aria-hidden="true">⏱</span>
        <span class="rest-time-pill" id="rest-time">1:30</span>
        <button data-delta="-15" type="button" class="rest-btn" aria-label="Restar 15 segundos">−15</button>
        <button data-delta="15"  type="button" class="rest-btn" aria-label="Sumar 15 segundos">+15</button>
        <button class="rest-cancel" id="rest-close" type="button" aria-label="Cerrar timer">✕</button>
    </div>

    <script>
    (function() {
        'use strict';

        // ========== DATOS DE LA RUTINA ==========
        const ROUTINE = [
            { id: 'lunes', cls: 'lunes', dow: 1, titulo: 'LUNES: EMPUJE', ejercicios: [
                { id: 'l1', nombre: 'Press Banca',                 series: 4, reps: 10, q: 'press de banca con barra pecho' },
                { id: 'l4', nombre: 'Press Inclinado Mancuernas', series: 4, reps: 10, q: 'press inclinado con mancuernas pecho superior' },
                { id: 'l2', nombre: 'Vuelos Laterales',           series: 4, reps: 10, q: 'vuelos laterales mancuernas' },
                { id: 'l3', nombre: 'Tríceps Polea',              series: 4, reps: 10, q: 'extension triceps polea alta' }
            ]},
            { id: 'martes', cls: 'martes', dow: 2, titulo: 'MARTES: TRACCIÓN', ejercicios: [
                { id: 'm1', nombre: 'Jalón al Pecho', series: 4, reps: 10, q: 'jalon al pecho espalda maquina' },
                { id: 'm2', nombre: 'Remo Sentado',   series: 4, reps: 10, q: 'remo sentado bajo polea baja' },
                { id: 'm4', nombre: 'Face Pull',      series: 4, reps: 12, q: 'face pull polea hombro posterior' },
                { id: 'm3', nombre: 'Curl Bíceps',    series: 4, reps: 10, q: 'curl de biceps mancuerna' }
            ]},
            { id: 'miercoles', cls: 'miercoles', dow: 3, titulo: 'MIÉRCOLES: PIERNAS', ejercicios: [
                { id: 'mi1', nombre: 'Prensa',            series: 4, reps: 10,            q: 'prensa de piernas 45 grados' },
                { id: 'mi2', nombre: 'Camilla Extension', series: 4, reps: 10,            q: 'camilla extension cuadriceps maquina' },
                { id: 'mi4', nombre: 'Curl Femoral',      series: 4, reps: 12,            q: 'curl femoral acostado maquina' },
                { id: 'mi3', nombre: 'Plancha Abdom.',    series: 4, repsLabel: '45 seg', q: 'plancha abdominal isometrica' }
            ]},
            { id: 'jueves', cls: 'jueves', dow: 4, titulo: 'JUEVES: ESCULPIR', ejercicios: [
                { id: 'j1', nombre: 'Remo 1 Mano',          series: 4, reps: 10, q: 'remo con mancuerna unilateral' },
                { id: 'j2', nombre: 'Press Militar',        series: 4, reps: 10, q: 'press militar hombros maquina' },
                { id: 'j3', nombre: 'Pec Deck',             series: 4, reps: 10, q: 'maquina pec deck pecho' },
                { id: 'j4', nombre: 'Elevación de Talones', series: 4, reps: 15, q: 'elevacion de talones gemelos maquina' }
            ]}
        ];

        const CARDIO = {
            cls: 'cardio-section',
            titulo: '⏱️ CARDIO: CINTA (25\')',
            filas: [
                { vel: '5 km/h',  tiempo: '5 min'  },
                { vel: '8 km/h',  tiempo: '15 min' },
                { vel: '11 km/h', tiempo: '2 min'  },
                { vel: '5 km/h',  tiempo: '3 min'  }
            ]
        };

        // ========== ESTADO ==========
        const STORAGE_KEY = 'gym:state';
        const HISTORY_LIMIT = 8;

        function getMondayISO(date) {
            const d = new Date(date || Date.now());
            d.setHours(0, 0, 0, 0);
            const day = d.getDay(); // 0=dom, 1=lun ... 6=sab
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            return d.toISOString().slice(0, 10);
        }

        function newState() {
            return { weekStart: getMondayISO(), exercises: {}, history: [] };
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return migrateLegacy() || newState();
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return newState();
                parsed.exercises = parsed.exercises || {};
                parsed.history   = parsed.history || [];
                parsed.weekStart = parsed.weekStart || getMondayISO();
                return parsed;
            } catch {
                return newState();
            }
        }

        // Migra checkboxes guardados con la versión vieja (key = id del ejercicio)
        function migrateLegacy() {
            const legacy = {};
            let found = false;
            ROUTINE.forEach(d => d.ejercicios.forEach(ex => {
                const v = localStorage.getItem(ex.id);
                if (v === 'true') { legacy[ex.id] = { done: true, series: [] }; found = true; }
                if (v !== null) localStorage.removeItem(ex.id);
            }));
            if (!found) return null;
            return { weekStart: getMondayISO(), exercises: legacy, history: [] };
        }

        function saveState() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
            catch (e) { console.warn('No se pudo guardar', e); }
        }

        function archiveAndReset() {
            if (Object.keys(state.exercises).length > 0) {
                state.history.unshift({ weekStart: state.weekStart, exercises: state.exercises });
                state.history = state.history.slice(0, HISTORY_LIMIT);
            }
            state.weekStart = getMondayISO();
            state.exercises = {};
            saveState();
        }

        let state = loadState();

        // Reset automático si cambió de semana
        if (state.weekStart !== getMondayISO()) {
            archiveAndReset();
        }

        function getEx(id) {
            if (!state.exercises[id]) state.exercises[id] = { done: false, series: [] };
            return state.exercises[id];
        }

        function getBestPrevious(exId) {
            for (const week of state.history) {
                const ex = week.exercises && week.exercises[exId];
                if (!ex || !ex.series) continue;
                const filled = ex.series.filter(s => s && (s.peso || s.reps));
                if (!filled.length) continue;
                const best = filled.reduce((a, b) =>
                    ((a.peso||0) * (a.reps||0)) >= ((b.peso||0) * (b.reps||0)) ? a : b
                );
                return { weekStart: week.weekStart, best };
            }
            return null;
        }

        function imageSearch(q) {
            return 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q);
        }

        function fmtFecha(iso) {
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y.slice(2)}`;
        }

        // ========== RENDER ==========
        const container = document.getElementById('routine-container');

        function render() {
            container.innerHTML = '';
            const todayDow = new Date().getDay();

            for (const day of ROUTINE) {
                container.appendChild(renderDay(day, todayDow));
            }
            container.appendChild(renderCardio());
        }

        function renderDay(day, todayDow) {
            const total = day.ejercicios.length;
            const done  = day.ejercicios.filter(e => getEx(e.id).done).length;
            const isToday = day.dow === todayDow;

            const section = document.createElement('section');
            section.className = `day-section ${day.cls}` + (isToday ? ' today' : '');
            section.dataset.dayId = day.id;

            const header = document.createElement('div');
            header.className = 'day-header';
            const todayBadge = isToday ? '<span class="today-badge">HOY</span>' : '';
            header.innerHTML = `
                <span class="day-title">${todayBadge}${day.titulo}</span>
                <span class="day-progress${done === total ? ' complete' : ''}">${done}/${total}</span>
            `;
            section.appendChild(header);

            for (const ex of day.ejercicios) {
                section.appendChild(renderExercise(ex));
            }
            return section;
        }

        function renderExercise(ex) {
            const exState = getEx(ex.id);
            const repsLabel = ex.repsLabel || `${ex.reps} Reps`;

            const wrap = document.createElement('div');
            wrap.className = 'exercise-item' + (exState.done ? ' checked' : '');
            wrap.dataset.id = ex.id;

            const prev = getBestPrevious(ex.id);
            const prevHTML = prev
                ? `<div class="last-record">📈 Mejor anterior (${fmtFecha(prev.weekStart)}): <strong>${prev.best.peso ?? '-'}kg × ${prev.best.reps ?? '-'}</strong></div>`
                : `<div class="last-record">📈 Sin registros previos — ¡arrancá!</div>`;

            let series = '';
            for (let i = 0; i < ex.series; i++) {
                const s = exState.series[i] || {};
                series += `
                    <div class="series-row">
                        <span class="series-label">S${i+1}</span>
                        <input type="number" class="serie-peso" data-idx="${i}" placeholder="kg" inputmode="decimal" step="0.5" min="0" value="${s.peso ?? ''}" aria-label="Peso serie ${i+1}">
                        <span class="series-x">×</span>
                        <input type="number" class="serie-reps" data-idx="${i}" placeholder="reps" inputmode="numeric" min="0" value="${s.reps ?? ''}" aria-label="Reps serie ${i+1}">
                    </div>
                `;
            }

            wrap.innerHTML = `
                <div class="check-row">
                    <label class="check-label">
                        <input type="checkbox" class="ex-check" ${exState.done ? 'checked' : ''}>
                        <span class="ex-name">${ex.nombre}</span>
                    </label>
                    <a href="${imageSearch(ex.q)}" target="_blank" rel="noopener" class="ex-search" aria-label="Buscar imágenes del ejercicio">🔍</a>
                </div>
                <div class="exercise-meta">
                    <span class="details">${ex.series} × ${repsLabel}</span>
                    <button class="btn-expand" type="button" aria-expanded="false" aria-label="Mostrar detalles">▼</button>
                </div>
                <div class="exercise-detail hidden">
                    ${prevHTML}
                    <div class="series-grid">${series}</div>
                    <button class="btn-rest" type="button" data-seconds="90">⏱ Descanso 90s</button>
                </div>
            `;
            return wrap;
        }

        function renderCardio() {
            const filas = CARDIO.filas.map(f =>
                `<tr><td>${f.vel}</td><td>${f.tiempo}</td></tr>`
            ).join('');
            const section = document.createElement('section');
            section.className = `day-section ${CARDIO.cls}`;
            section.innerHTML = `
                <div class="day-header"><span class="day-title">${CARDIO.titulo}</span></div>
                <table class="cardio-table">
                    <thead><tr><th>Velocidad</th><th>Tiempo</th></tr></thead>
                    <tbody>${filas}</tbody>
                </table>
            `;
            return section;
        }

        function updateDayProgress(exId) {
            const day = ROUTINE.find(d => d.ejercicios.some(e => e.id === exId));
            if (!day) return;
            const total = day.ejercicios.length;
            const done  = day.ejercicios.filter(e => getEx(e.id).done).length;
            const section = container.querySelector(`[data-day-id="${day.id}"]`);
            const badge = section && section.querySelector('.day-progress');
            if (!badge) return;
            badge.textContent = `${done}/${total}`;
            badge.classList.toggle('complete', done === total);
        }

        function updateGlobalProgress() {
            let total = 0, done = 0;
            for (const day of ROUTINE) {
                for (const ex of day.ejercicios) {
                    total++;
                    if (getEx(ex.id).done) done++;
                }
            }
            const pct = total > 0 ? (done / total) * 100 : 0;
            const fill = document.getElementById('topbar-progress');
            if (fill) fill.style.width = pct + '%';
            const wi = document.getElementById('week-info');
            if (wi) wi.textContent = `Semana del ${fmtFecha(state.weekStart)} · ${done}/${total} completados`;
        }

        // ========== EVENTOS ==========
        container.addEventListener('change', (e) => {
            if (!e.target.classList.contains('ex-check')) return;
            const item = e.target.closest('.exercise-item');
            const id = item.dataset.id;
            getEx(id).done = e.target.checked;
            item.classList.toggle('checked', e.target.checked);
            if (e.target.checked) {
                item.classList.remove('just-checked');
                // Reflow para reiniciar la animación si se chequea de nuevo rápido
                void item.offsetWidth;
                item.classList.add('just-checked');
                setTimeout(() => item.classList.remove('just-checked'), 700);
            }
            updateDayProgress(id);
            updateGlobalProgress();
            saveState();
        });

        container.addEventListener('input', (e) => {
            const isPeso = e.target.classList.contains('serie-peso');
            const isReps = e.target.classList.contains('serie-reps');
            if (!isPeso && !isReps) return;
            const item = e.target.closest('.exercise-item');
            const ex = getEx(item.dataset.id);
            const idx = parseInt(e.target.dataset.idx, 10);
            if (!ex.series[idx]) ex.series[idx] = {};
            const raw = e.target.value;
            const val = raw === '' ? null : parseFloat(raw);
            ex.series[idx][isPeso ? 'peso' : 'reps'] = (Number.isFinite(val) ? val : null);
            saveState();
        });

        container.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-expand')) {
                const item = e.target.closest('.exercise-item');
                const detail = item.querySelector('.exercise-detail');
                const willOpen = detail.classList.contains('hidden');

                // Acordeón: si vamos a abrir uno, cerramos cualquier otro abierto
                if (willOpen) {
                    container.querySelectorAll('.exercise-detail:not(.hidden)').forEach(d => {
                        d.classList.add('hidden');
                        const otherBtn = d.parentElement.querySelector('.btn-expand');
                        if (otherBtn) {
                            otherBtn.textContent = '▼';
                            otherBtn.setAttribute('aria-expanded', 'false');
                        }
                    });
                }

                detail.classList.toggle('hidden');
                e.target.textContent = willOpen ? '▲' : '▼';
                e.target.setAttribute('aria-expanded', String(willOpen));

                if (willOpen) {
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            } else if (e.target.classList.contains('btn-rest')) {
                startRest(parseInt(e.target.dataset.seconds, 10) || 90);
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm('¿Reiniciar el progreso de esta semana?\n(Se guardará en el historial para comparar pesos)')) {
                archiveAndReset();
                render();
                updateGlobalProgress();
            }
        });

        // ========== TIMER DE DESCANSO (pastilla flotante) ==========
        const restPill   = document.getElementById('rest-pill');
        const restTimeEl = document.getElementById('rest-time');
        let restInterval = null;
        let restRemaining = 0;

        function fmtMMSS(s) {
            const safe = Math.max(0, s|0);
            const m = Math.floor(safe / 60);
            const sec = safe % 60;
            return `${m}:${String(sec).padStart(2, '0')}`;
        }

        function startRest(seconds) {
            restRemaining = seconds;
            restPill.classList.remove('done', 'hidden');
            paintRest();
            if (restInterval) clearInterval(restInterval);
            restInterval = setInterval(tickRest, 1000);
        }

        function tickRest() {
            restRemaining--;
            paintRest();
            if (restRemaining <= 0) {
                clearInterval(restInterval);
                restInterval = null;
                restPill.classList.add('done');
                if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
                beep();
            }
        }

        function paintRest() {
            restTimeEl.textContent = fmtMMSS(restRemaining);
        }

        function beep() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.7);
                osc.start();
                osc.stop(ctx.currentTime + 0.7);
            } catch {}
        }

        function closeRest() {
            if (restInterval) { clearInterval(restInterval); restInterval = null; }
            restPill.classList.add('hidden');
            restPill.classList.remove('done');
        }

        document.getElementById('rest-close').addEventListener('click', closeRest);
        restPill.addEventListener('click', (e) => {
            const delta = e.target.dataset && e.target.dataset.delta;
            if (!delta) return;
            restRemaining = Math.max(0, restRemaining + parseInt(delta, 10));
            if (restRemaining > 0 && !restInterval) {
                restPill.classList.remove('done');
                restInterval = setInterval(tickRest, 1000);
            }
            paintRest();
        });

        // ========== AUTO-SCROLL AL PRIMER PENDIENTE DE HOY ==========
        function scrollToTodayFirst() {
            const todayDow = new Date().getDay();
            const day = ROUTINE.find(d => d.dow === todayDow);
            if (!day) return; // viernes/finde: no es día de rutina
            const pending = day.ejercicios.find(e => !getEx(e.id).done);
            if (!pending) return; // ya está todo completo
            const item = container.querySelector(`[data-id="${pending.id}"]`);
            if (!item) return;
            // Esperamos un tick para que el layout (incluyendo el sticky topbar) esté listo
            requestAnimationFrame(() => {
                setTimeout(() => {
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 250);
            });
        }

        // ========== INICIO ==========
        render();
        updateGlobalProgress();
        scrollToTodayFirst();

        // ========== SERVICE WORKER ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .then(reg => console.log('SW registrado:', reg.scope))
                    .catch(err => console.log('SW falló:', err));
            });
        }
    })();
    </script>
</body>
</html>
