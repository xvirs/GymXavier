<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tracker personal de rutina de gimnasio con seguimiento de pesos por serie, timer de descanso, progreso semanal y reset automático.">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GymPro">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Open Graph -->
    <meta property="og:title" content="Gym Pro Tracker">
    <meta property="og:description" content="Tracker personal de rutina con seguimiento de pesos y progreso semanal.">
    <meta property="og:type" content="website">

    <!-- Manifest e iconos -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <title>Gym Pro Tracker - Xavier</title>

    <style>
        :root {
            --bg: #0a0a0a;
            --card: #161616;
            --accent: #ffcd11;
            --accent-dark: #c79f00;
            --text: #f4f4f4;
            --subtext: #9a9a9a;
            --done: #ffcd11;
            --push: #ff6b00;
            --pull: #ffd700;
            --legs: #ffcd11;
            --sculpt: #e8e8e8;
            --cardio: #e63946;
            --danger: #e63946;
            --hazard: repeating-linear-gradient(135deg, #ffcd11 0 14px, #0a0a0a 14px 28px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Impact', 'Arial Black', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 20% 10%, rgba(255,205,17,0.04), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255,205,17,0.03), transparent 40%);
            color: var(--text);
            margin: 0;
            padding: 0 0 90px 0;
            line-height: 1.5;
        }

        .container { padding: 16px 15px 0 15px; }

        /* Top bar (sticky) */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top, 12px));
            background: rgba(10, 10, 10, 0.92);
            border-bottom: 3px solid var(--accent);
            -webkit-backdrop-filter: saturate(160%) blur(14px);
            backdrop-filter: saturate(160%) blur(14px);
        }
        .topbar::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 6px;
            background: var(--hazard);
            opacity: 0.85;
        }
        .topbar-progress-track {
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 3px;
            background: rgba(255,205,17,0.12);
            overflow: hidden;
        }
        .topbar-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #fff200);
            box-shadow: 0 0 10px rgba(255,205,17,0.6);
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .topbar-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #000;
        }
        .topbar-title-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 0 6px rgba(255,205,17,0.55));
        }

        /* Profile card */
        .profile-card {
            position: relative;
            background:
                linear-gradient(135deg, rgba(255,205,17,0.08), rgba(255,205,17,0.02)),
                #161616;
            border: 2px solid var(--accent);
            border-radius: 4px;
            padding: 14px 16px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0 #000, 0 0 0 1px rgba(255,205,17,0.2);
        }
        .profile-card::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 5px;
            background: var(--hazard);
            border-radius: 4px 4px 0 0;
        }
        .profile-stats {
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }
        .profile-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
            min-width: 0;
        }
        .stat-label {
            font-size: 0.65rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 900;
        }
        .stat-value {
            font-size: 1rem;
            color: var(--text);
            font-weight: 900;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .week-info {
            text-align: center;
            color: var(--subtext);
            font-size: 0.78rem;
            border-top: 1px dashed rgba(255,205,17,0.3);
            padding-top: 10px;
            margin-top: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* "HOY" badge for current weekday */
        .today-badge {
            display: inline-block;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 2px;
            margin-right: 8px;
            letter-spacing: 1.5px;
            vertical-align: 2px;
            box-shadow: 2px 2px 0 #000;
        }

        .day-section {
            background: var(--card);
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0 #000, 0 0 0 1px rgba(255,255,255,0.04);
            border: 1px solid #2a2a2a;
        }

        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
            border-bottom: 2px dashed rgba(255,205,17,0.4);
            padding-bottom: 10px;
        }

        .day-title { font-weight: 900; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 1px 1px 0 #000; }
        .day-progress {
            font-size: 0.85rem;
            color: var(--subtext);
            background: #0a0a0a;
            padding: 4px 10px;
            border-radius: 2px;
            font-weight: 900;
            border: 1px solid #2a2a2a;
        }
        .day-progress.complete { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }

        .lunes { border-left: 8px solid var(--push); }
        .lunes .day-title { color: var(--push); }
        .martes { border-left: 8px solid var(--pull); }
        .martes .day-title { color: var(--pull); }
        .miercoles { border-left: 8px solid var(--legs); }
        .miercoles .day-title { color: var(--legs); }
        .jueves { border-left: 8px solid var(--sculpt); }
        .jueves .day-title { color: var(--sculpt); }
        .cardio-section { border-left: 8px solid var(--cardio); }
        .cardio-section .day-title { color: var(--cardio); }

        .day-section.today {
            box-shadow: 0 0 0 3px var(--accent), 6px 6px 0 #000;
            border-color: var(--accent);
        }

        .day-header[role="button"] { cursor: pointer; user-select: none; }
        .day-header[role="button"]:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .day-header-right {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .day-chevron {
            display: inline-block;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 900;
            transition: transform 0.25s ease;
        }
        .day-header[aria-expanded="true"] .day-chevron { transform: rotate(180deg); }
        .day-section.collapsed .day-header {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .day-section.collapsed { padding-bottom: 14px; margin-bottom: 12px; }

        .exercise-item {
            background: #0a0a0a;
            margin-bottom: 12px;
            padding: 12px 14px;
            border-radius: 3px;
            transition: opacity 0.35s ease, border-color 0.3s ease, transform 0.25s ease;
            border: 1px solid #2a2a2a;
        }

        .exercise-item.checked {
            opacity: 0.55;
            border-color: var(--accent);
            background: rgba(255,205,17,0.04);
            transform: scale(0.985);
        }
        .exercise-item.just-checked {
            animation: justChecked 0.7s ease-out;
        }
        @keyframes justChecked {
            0%   { box-shadow: 0 0 0 0 rgba(255,205,17,0.65); }
            60%  { box-shadow: 0 0 0 12px rgba(255,205,17,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,205,17,0); }
        }

        .check-row { display: flex; align-items: center; gap: 8px; }

        .check-label {
            display: flex;
            align-items: center;
            flex-grow: 1;
            cursor: pointer;
            min-height: 36px;
        }

        input[type="checkbox"] {
            width: 26px;
            height: 26px;
            margin-right: 12px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .ex-name {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ex-search {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 3px;
            background: var(--accent);
            color: #0a0a0a;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 900;
            flex-shrink: 0;
            box-shadow: 2px 2px 0 #000;
        }
        .ex-search:active { background: var(--accent-dark); transform: translate(1px,1px); box-shadow: 1px 1px 0 #000; }

        .exercise-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            margin-left: 38px;
        }

        .details {
            background: #000;
            padding: 6px 10px;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255,205,17,0.3);
        }

        .btn-expand {
            background: #000;
            color: var(--accent);
            border: 1px solid var(--accent);
            width: 36px;
            height: 32px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 900;
        }
        .btn-expand:active { background: var(--accent); color: #000; }

        .exercise-detail {
            margin-top: 12px;
            margin-left: 38px;
            padding: 12px;
            background: #000;
            border-radius: 2px;
            border: 1px solid rgba(255,205,17,0.2);
        }

        .last-record {
            font-size: 0.85rem;
            color: var(--subtext);
            margin-bottom: 10px;
            font-weight: 700;
        }
        .last-record strong { color: var(--accent); }

        .series-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

        .series-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .series-label {
            font-weight: 700;
            color: var(--subtext);
            font-size: 0.85rem;
            width: 28px;
            flex-shrink: 0;
        }

        .series-row input[type="number"] {
            flex: 1;
            min-width: 0;
            background: #161616;
            color: var(--text);
            border: 1px solid #333;
            border-radius: 2px;
            padding: 8px 10px;
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
        }
        .series-row input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            background: #1f1f1f;
            box-shadow: 0 0 0 2px rgba(255,205,17,0.3);
        }
        .series-row input::-webkit-outer-spin-button,
        .series-row input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .series-row input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

        .series-x { color: var(--subtext); font-weight: 700; }

        .series-diff {
            font-size: 0.7rem;
            font-weight: 900;
            color: #4ade80;
            background: rgba(74,222,128,0.12);
            border: 1px solid rgba(74,222,128,0.45);
            padding: 4px 7px;
            border-radius: 2px;
            white-space: nowrap;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            animation: diffPop 0.3s ease-out;
        }
        .series-diff:empty { display: none; }
        @keyframes diffPop {
            from { transform: scale(0.6); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .btn-copy-last {
            width: 100%;
            background: transparent;
            color: var(--accent);
            border: 1px dashed rgba(255,205,17,0.55);
            padding: 9px 10px;
            border-radius: 2px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-copy-last:active { background: rgba(255,205,17,0.12); }

        .btn-rest {
            width: 100%;
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            padding: 12px;
            border-radius: 2px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 3px 3px 0 #000;
        }
        .btn-rest:active { background: var(--accent-dark); transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }

        .cardio-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }
        .cardio-table th, .cardio-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            font-weight: 800;
        }
        .cardio-table th {
            background: #0a0a0a;
            color: var(--accent);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--accent);
        }
        .cardio-table td { background: #161616; }

        .data-section {
            margin-top: 32px;
            padding: 18px 14px;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            background: #0a0a0a;
        }
        .data-section-title {
            margin: 0 0 12px 0;
            font-size: 0.78rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            text-align: center;
        }
        .data-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-data {
            background: transparent;
            color: var(--accent);
            border: 1.5px dashed rgba(255,205,17,0.55);
            padding: 11px 8px;
            border-radius: 2px;
            font-weight: 900;
            font-size: 0.78rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-data:active { background: rgba(255,205,17,0.12); }
        .btn-data-secondary {
            width: 100%;
            background: transparent;
            color: var(--subtext);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 9px 10px;
            border-radius: 2px;
            font-weight: 800;
            font-size: 0.72rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-data-secondary:active { background: rgba(255,255,255,0.05); }
        .paste-panel {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .paste-area {
            width: 100%;
            min-height: 140px;
            background: #161616;
            color: var(--text);
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            padding: 10px;
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.78rem;
            line-height: 1.45;
            resize: vertical;
        }
        .paste-area::placeholder { color: var(--subtext); opacity: 0.7; }
        .paste-area:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255,205,17,0.3);
        }
        .data-hint {
            margin: 12px 0 0 0;
            color: var(--subtext);
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            font-weight: 600;
            line-height: 1.45;
            text-align: center;
        }
        .data-hint.is-error { color: var(--danger); }
        .data-hint.is-success { color: #4ade80; }

        .reset-section {
            margin-top: 28px;
            padding: 16px 8px 8px 8px;
            text-align: center;
        }
        .btn-reset {
            background: transparent;
            color: var(--danger);
            border: 2px dashed rgba(230,57,70,0.55);
            padding: 12px 22px;
            border-radius: 2px;
            font-weight: 900;
            font-size: 0.82rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-reset:active { background: rgba(230,57,70,0.12); }
        .reset-hint {
            margin: 12px 0 0 0;
            color: var(--subtext);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .hidden { display: none !important; }

        /* Floating rest timer pill */
        .rest-pill {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a0a;
            border: 3px solid var(--accent);
            border-radius: 2px;
            padding: 8px 10px 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 150;
            box-shadow: 4px 4px 0 #000, 0 0 20px rgba(255,205,17,0.4);
            font-weight: 900;
            color: var(--text);
            max-width: calc(100vw - 30px);
            animation: pillIn 0.25s ease-out;
        }
        @keyframes pillIn {
            from { opacity: 0; transform: translate(-50%, 12px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }
        .rest-icon { font-size: 1.1rem; }
        .rest-time-pill {
            font-size: 1.4rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            font-weight: 900;
            min-width: 56px;
            text-align: center;
            letter-spacing: 1px;
        }
        .rest-btn {
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            height: 34px;
            padding: 0 12px;
            border-radius: 2px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .rest-btn:active { background: var(--accent-dark); }
        .rest-cancel {
            background: var(--danger);
            color: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 2px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .rest-cancel:active { background: #b8222e; }
        .rest-pill.done {
            background: var(--accent);
            border-color: #000;
            color: #0a0a0a;
            animation: pulse 0.6s ease-in-out infinite;
        }
        .rest-pill.done .rest-time-pill { color: #0a0a0a; }
        .rest-pill.done .rest-btn,
        .rest-pill.done .rest-cancel {
            background: #0a0a0a;
            color: var(--accent);
        }
        @keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
    </style>
</head>
<body>
    <header class="topbar">
        <h1 class="topbar-title">
            <span class="topbar-title-icon" aria-hidden="true">🏋</span>
            <span>Gym Pro</span>
        </h1>
        <div class="topbar-progress-track" aria-hidden="true">
            <div class="topbar-progress-fill" id="topbar-progress"></div>
        </div>
    </header>

    <main class="container">
        <section class="profile-card">
            <div class="profile-stats">
                <div class="profile-stat">
                    <span class="stat-label">Altura</span>
                    <span class="stat-value">1.75m</span>
                </div>
                <div class="profile-stat">
                    <span class="stat-label">Peso</span>
                    <span class="stat-value">83kg</span>
                </div>
                <div class="profile-stat">
                    <span class="stat-label">Meta</span>
                    <span class="stat-value">Definición</span>
                </div>
            </div>
            <div class="week-info" id="week-info"></div>
        </section>

        <div id="routine-container"></div>

        <section class="data-section">
            <h2 class="data-section-title">Mi rutina</h2>
            <div class="data-actions">
                <button class="btn-data" id="btn-export" type="button">
                    <span aria-hidden="true">📤</span><span>Exportar</span>
                </button>
                <button class="btn-data" id="btn-import" type="button">
                    <span aria-hidden="true">📥</span><span>Importar</span>
                </button>
            </div>
            <button class="btn-data-secondary" id="btn-paste-toggle" type="button" aria-expanded="false" aria-controls="paste-panel">
                + Pegar JSON
            </button>
            <div class="paste-panel hidden" id="paste-panel">
                <textarea id="paste-area" class="paste-area" rows="8" spellcheck="false" placeholder='Pegá acá el JSON exportado&#10;{"version":1,"routine":[...]}'></textarea>
                <button class="btn-data" id="btn-paste-apply" type="button">
                    <span aria-hidden="true">✓</span><span>Aplicar JSON pegado</span>
                </button>
            </div>
            <button class="btn-data-secondary" id="btn-restore-default" type="button">
                ↺ Restaurar rutina por defecto
            </button>
            <input type="file" id="file-import" accept="application/json,.json" hidden>
            <p class="data-hint" id="data-hint">Exportá tu rutina como JSON, editala y reimportala. Tu progreso e historial no se borran.</p>
        </section>

        <section class="reset-section">
            <button class="btn-reset" id="btn-reset" type="button">
                <span aria-hidden="true">🔄</span>
                <span>Reiniciar semana</span>
            </button>
            <p class="reset-hint">Se guarda en el historial para comparar pesos.</p>
        </section>
    </main>

    <div id="rest-pill" class="rest-pill hidden" role="status" aria-live="polite" aria-label="Timer de descanso">
        <span class="rest-icon" aria-hidden="true">⏱</span>
        <span class="rest-time-pill" id="rest-time">1:30</span>
        <button data-delta="-15" type="button" class="rest-btn" aria-label="Restar 15 segundos">−15</button>
        <button data-delta="15"  type="button" class="rest-btn" aria-label="Sumar 15 segundos">+15</button>
        <button class="rest-cancel" id="rest-close" type="button" aria-label="Cerrar timer">✕</button>
    </div>

    <script>
    (function() {
        'use strict';

        // ========== DATOS DE LA RUTINA (DEFAULT) ==========
        const DEFAULT_ROUTINE = [
            { id: 'lunes', cls: 'lunes', dow: 1, titulo: 'LUNES: EMPUJE', ejercicios: [
                { id: 'l1', nombre: 'Press Banca',                 series: 4, reps: 10, q: 'press de banca con barra pecho' },
                { id: 'l4', nombre: 'Press Inclinado Mancuernas', series: 4, reps: 10, q: 'press inclinado con mancuernas pecho superior' },
                { id: 'l2', nombre: 'Vuelos Laterales',           series: 4, reps: 10, q: 'vuelos laterales mancuernas' },
                { id: 'l3', nombre: 'Tríceps Polea',              series: 4, reps: 10, q: 'extension triceps polea alta' }
            ]},
            { id: 'martes', cls: 'martes', dow: 2, titulo: 'MARTES: TRACCIÓN', ejercicios: [
                { id: 'm1', nombre: 'Jalón al Pecho', series: 4, reps: 10, q: 'jalon al pecho espalda maquina' },
                { id: 'm2', nombre: 'Remo Sentado',   series: 4, reps: 10, q: 'remo sentado bajo polea baja' },
                { id: 'm4', nombre: 'Face Pull',      series: 4, reps: 12, q: 'face pull polea hombro posterior' },
                { id: 'm3', nombre: 'Curl Bíceps',    series: 4, reps: 10, q: 'curl de biceps mancuerna' }
            ]},
            { id: 'miercoles', cls: 'miercoles', dow: 3, titulo: 'MIÉRCOLES: PIERNAS', ejercicios: [
                { id: 'mi1', nombre: 'Prensa',            series: 4, reps: 10,            q: 'prensa de piernas 45 grados' },
                { id: 'mi2', nombre: 'Camilla Extension', series: 4, reps: 10,            q: 'camilla extension cuadriceps maquina' },
                { id: 'mi4', nombre: 'Curl Femoral',      series: 4, reps: 12,            q: 'curl femoral acostado maquina' },
                { id: 'mi3', nombre: 'Plancha Abdom.',    series: 4, repsLabel: '45 seg', q: 'plancha abdominal isometrica' }
            ]},
            { id: 'jueves', cls: 'jueves', dow: 4, titulo: 'JUEVES: ESCULPIR', ejercicios: [
                { id: 'j1', nombre: 'Remo 1 Mano',          series: 4, reps: 10, q: 'remo con mancuerna unilateral' },
                { id: 'j2', nombre: 'Press Militar',        series: 4, reps: 10, q: 'press militar hombros maquina' },
                { id: 'j3', nombre: 'Pec Deck',             series: 4, reps: 10, q: 'maquina pec deck pecho' },
                { id: 'j4', nombre: 'Elevación de Talones', series: 4, reps: 15, q: 'elevacion de talones gemelos maquina' }
            ]}
        ];

        const DEFAULT_CARDIO = {
            cls: 'cardio-section',
            titulo: '⏱️ CARDIO: CINTA (25\')',
            filas: [
                { vel: '5 km/h',  tiempo: '5 min'  },
                { vel: '8 km/h',  tiempo: '15 min' },
                { vel: '11 km/h', tiempo: '2 min'  },
                { vel: '5 km/h',  tiempo: '3 min'  }
            ]
        };

        // ========== RUTINA PERSONALIZADA (import/export) ==========
        const ROUTINE_KEY = 'gym:routine';

        function isValidRoutineData(data) {
            if (!data || typeof data !== 'object') return false;
            if (!Array.isArray(data.routine) || data.routine.length === 0) return false;
            const seenIds = new Set();
            for (const day of data.routine) {
                if (!day || typeof day !== 'object') return false;
                if (typeof day.id !== 'string' || !day.id) return false;
                if (typeof day.cls !== 'string') return false;
                if (typeof day.dow !== 'number' || day.dow < 0 || day.dow > 6) return false;
                if (typeof day.titulo !== 'string') return false;
                if (!Array.isArray(day.ejercicios) || day.ejercicios.length === 0) return false;
                for (const ex of day.ejercicios) {
                    if (!ex || typeof ex !== 'object') return false;
                    if (typeof ex.id !== 'string' || !ex.id) return false;
                    if (seenIds.has(ex.id)) return false; // IDs únicos
                    seenIds.add(ex.id);
                    if (typeof ex.nombre !== 'string' || !ex.nombre) return false;
                    if (typeof ex.series !== 'number' || ex.series <= 0 || ex.series > 20) return false;
                    if (typeof ex.reps !== 'number' && typeof ex.repsLabel !== 'string') return false;
                }
            }
            if (data.cardio != null) {
                if (typeof data.cardio !== 'object') return false;
                if (typeof data.cardio.titulo !== 'string') return false;
                if (!Array.isArray(data.cardio.filas)) return false;
            }
            return true;
        }

        function loadStoredRoutine() {
            try {
                const raw = localStorage.getItem(ROUTINE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return isValidRoutineData(parsed) ? parsed : null;
            } catch { return null; }
        }

        let ROUTINE, CARDIO;
        (function applyStoredRoutine() {
            const stored = loadStoredRoutine();
            if (stored) {
                ROUTINE = stored.routine;
                CARDIO  = stored.cardio || DEFAULT_CARDIO;
            } else {
                ROUTINE = DEFAULT_ROUTINE;
                CARDIO  = DEFAULT_CARDIO;
            }
        })();

        // ========== ESTADO ==========
        const STORAGE_KEY = 'gym:state';
        const HISTORY_LIMIT = 8;

        function getMondayISO(date) {
            const d = new Date(date || Date.now());
            d.setHours(0, 0, 0, 0);
            const day = d.getDay(); // 0=dom, 1=lun ... 6=sab
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            return d.toISOString().slice(0, 10);
        }

        function newState() {
            return { weekStart: getMondayISO(), exercises: {}, history: [] };
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return migrateLegacy() || newState();
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return newState();
                parsed.exercises = parsed.exercises || {};
                parsed.history   = parsed.history || [];
                parsed.weekStart = parsed.weekStart || getMondayISO();
                return parsed;
            } catch {
                return newState();
            }
        }

        // Migra checkboxes guardados con la versión vieja (key = id del ejercicio)
        function migrateLegacy() {
            const legacy = {};
            let found = false;
            ROUTINE.forEach(d => d.ejercicios.forEach(ex => {
                const v = localStorage.getItem(ex.id);
                if (v === 'true') { legacy[ex.id] = { done: true, series: [] }; found = true; }
                if (v !== null) localStorage.removeItem(ex.id);
            }));
            if (!found) return null;
            return { weekStart: getMondayISO(), exercises: legacy, history: [] };
        }

        function saveState() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
            catch (e) { console.warn('No se pudo guardar', e); }
        }

        function archiveAndReset() {
            if (Object.keys(state.exercises).length > 0) {
                state.history.unshift({ weekStart: state.weekStart, exercises: state.exercises });
                state.history = state.history.slice(0, HISTORY_LIMIT);
            }
            state.weekStart = getMondayISO();
            state.exercises = {};
            saveState();
        }

        let state = loadState();

        // Reset automático si cambió de semana
        if (state.weekStart !== getMondayISO()) {
            archiveAndReset();
        }

        function getEx(id) {
            if (!state.exercises[id]) state.exercises[id] = { done: false, series: [] };
            return state.exercises[id];
        }

        function findExerciseDef(id) {
            for (const day of ROUTINE) {
                const ex = day.ejercicios.find(e => e.id === id);
                if (ex) return ex;
            }
            return null;
        }

        function isAllSeriesFilled(exDef, exState) {
            if (!exDef || !exState || !exState.series) return false;
            for (let i = 0; i < exDef.series; i++) {
                const s = exState.series[i];
                if (!s) return false;
                const p = Number(s.peso), r = Number(s.reps);
                if (!Number.isFinite(p) || p <= 0) return false;
                if (!Number.isFinite(r) || r <= 0) return false;
            }
            return true;
        }

        function getLastSession(exId) {
            for (const week of state.history) {
                const ex = week.exercises && week.exercises[exId];
                if (!ex || !ex.series) continue;
                const filled = ex.series.filter(s => s && (s.peso || s.reps));
                if (!filled.length) continue;
                return { weekStart: week.weekStart, series: ex.series };
            }
            return null;
        }

        function formatDelta(d) {
            if (Number.isInteger(d)) return String(d);
            return d.toFixed(1).replace(/\.0$/, '');
        }

        function computeSeriesDiff(curPeso, curReps, prev) {
            if (!prev) return null;
            const cP = Number(curPeso), cR = Number(curReps);
            const pP = Number(prev.peso), pR = Number(prev.reps);
            if (!Number.isFinite(cP) || cP <= 0) return null;
            if (!Number.isFinite(pP) || pP <= 0) return null;
            if (cP > pP) return { text: `+${formatDelta(cP - pP)}kg` };
            if (cP === pP && Number.isFinite(cR) && Number.isFinite(pR) && cR > pR) {
                return { text: `+${cR - pR} reps` };
            }
            return null;
        }

        function updateSingleSeriesDiff(item, idx) {
            const span = item.querySelector(`.series-diff[data-idx="${idx}"]`);
            if (!span) return;
            const exId = item.dataset.id;
            const ex = getEx(exId);
            const last = getLastSession(exId);
            if (!last) { span.textContent = ''; return; }
            const cur = ex.series[idx] || {};
            const prev = last.series[idx] || null;
            const diff = computeSeriesDiff(cur.peso, cur.reps, prev);
            const next = diff ? diff.text : '';
            if (span.textContent !== next) span.textContent = next;
        }

        function updateAllSeriesDiffs(item) {
            const exDef = findExerciseDef(item.dataset.id);
            if (!exDef) return;
            for (let i = 0; i < exDef.series; i++) updateSingleSeriesDiff(item, i);
        }

        function getBestPrevious(exId) {
            for (const week of state.history) {
                const ex = week.exercises && week.exercises[exId];
                if (!ex || !ex.series) continue;
                const filled = ex.series.filter(s => s && (s.peso || s.reps));
                if (!filled.length) continue;
                const best = filled.reduce((a, b) =>
                    ((a.peso||0) * (a.reps||0)) >= ((b.peso||0) * (b.reps||0)) ? a : b
                );
                return { weekStart: week.weekStart, best };
            }
            return null;
        }

        function imageSearch(q) {
            return 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q);
        }

        function fmtFecha(iso) {
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y.slice(2)}`;
        }

        // ========== RENDER ==========
        const container = document.getElementById('routine-container');

        function render() {
            container.innerHTML = '';
            const todayDow = new Date().getDay();

            for (const day of ROUTINE) {
                container.appendChild(renderDay(day, todayDow));
            }
            container.appendChild(renderCardio());
            container.querySelectorAll('.exercise-item').forEach(updateAllSeriesDiffs);
        }

        function renderDay(day, todayDow) {
            const total = day.ejercicios.length;
            const done  = day.ejercicios.filter(e => getEx(e.id).done).length;
            const isToday = day.dow === todayDow;

            const section = document.createElement('section');
            section.className = `day-section ${day.cls}` + (isToday ? ' today' : ' collapsed');
            section.dataset.dayId = day.id;

            const header = document.createElement('div');
            header.className = 'day-header';
            const todayBadge = isToday ? '<span class="today-badge">HOY</span>' : '';
            const chevron = isToday ? '' : '<span class="day-chevron" aria-hidden="true">▾</span>';
            if (!isToday) {
                header.setAttribute('role', 'button');
                header.setAttribute('tabindex', '0');
                header.setAttribute('aria-expanded', 'false');
                header.setAttribute('aria-controls', `day-content-${day.id}`);
            }
            header.innerHTML = `
                <span class="day-title">${todayBadge}${day.titulo}</span>
                <span class="day-header-right">
                    <span class="day-progress${done === total ? ' complete' : ''}">${done}/${total}</span>
                    ${chevron}
                </span>
            `;
            section.appendChild(header);

            const content = document.createElement('div');
            content.className = 'day-content' + (isToday ? '' : ' hidden');
            content.id = `day-content-${day.id}`;
            for (const ex of day.ejercicios) {
                content.appendChild(renderExercise(ex));
            }
            section.appendChild(content);
            return section;
        }

        function renderExercise(ex) {
            const exState = getEx(ex.id);
            const repsLabel = ex.repsLabel || `${ex.reps} Reps`;

            const wrap = document.createElement('div');
            wrap.className = 'exercise-item' + (exState.done ? ' checked' : '');
            wrap.dataset.id = ex.id;

            const prev = getBestPrevious(ex.id);
            const prevHTML = prev
                ? `<div class="last-record">📈 Mejor anterior (${fmtFecha(prev.weekStart)}): <strong>${prev.best.peso ?? '-'}kg × ${prev.best.reps ?? '-'}</strong></div>`
                : `<div class="last-record">📈 Sin registros previos — ¡arrancá!</div>`;

            const lastSession = getLastSession(ex.id);
            const copyHTML = lastSession
                ? `<button class="btn-copy-last" type="button">📋 Copiar pesos del ${fmtFecha(lastSession.weekStart)}</button>`
                : '';

            let series = '';
            for (let i = 0; i < ex.series; i++) {
                const s = exState.series[i] || {};
                series += `
                    <div class="series-row">
                        <span class="series-label">S${i+1}</span>
                        <input type="number" class="serie-peso" data-idx="${i}" placeholder="kg" inputmode="decimal" step="0.5" min="0" value="${s.peso ?? ''}" aria-label="Peso serie ${i+1}">
                        <span class="series-x">×</span>
                        <input type="number" class="serie-reps" data-idx="${i}" placeholder="reps" inputmode="numeric" min="0" value="${s.reps ?? ''}" aria-label="Reps serie ${i+1}">
                        <span class="series-diff" data-idx="${i}"></span>
                    </div>
                `;
            }

            wrap.innerHTML = `
                <div class="check-row">
                    <label class="check-label">
                        <input type="checkbox" class="ex-check" ${exState.done ? 'checked' : ''}>
                        <span class="ex-name">${ex.nombre}</span>
                    </label>
                    <a href="${imageSearch(ex.q)}" target="_blank" rel="noopener" class="ex-search" aria-label="Buscar imágenes del ejercicio">🔍</a>
                </div>
                <div class="exercise-meta">
                    <span class="details">${ex.series} × ${repsLabel}</span>
                    <button class="btn-expand" type="button" aria-expanded="false" aria-label="Mostrar detalles">▼</button>
                </div>
                <div class="exercise-detail hidden">
                    ${prevHTML}
                    ${copyHTML}
                    <div class="series-grid">${series}</div>
                    <button class="btn-rest" type="button" data-seconds="90">⏱ Descanso 90s</button>
                </div>
            `;
            return wrap;
        }

        function renderCardio() {
            const filas = CARDIO.filas.map(f =>
                `<tr><td>${f.vel}</td><td>${f.tiempo}</td></tr>`
            ).join('');
            const section = document.createElement('section');
            section.className = `day-section ${CARDIO.cls}`;
            section.innerHTML = `
                <div class="day-header"><span class="day-title">${CARDIO.titulo}</span></div>
                <table class="cardio-table">
                    <thead><tr><th>Velocidad</th><th>Tiempo</th></tr></thead>
                    <tbody>${filas}</tbody>
                </table>
            `;
            return section;
        }

        function updateDayProgress(exId) {
            const day = ROUTINE.find(d => d.ejercicios.some(e => e.id === exId));
            if (!day) return;
            const total = day.ejercicios.length;
            const done  = day.ejercicios.filter(e => getEx(e.id).done).length;
            const section = container.querySelector(`[data-day-id="${day.id}"]`);
            const badge = section && section.querySelector('.day-progress');
            if (!badge) return;
            badge.textContent = `${done}/${total}`;
            badge.classList.toggle('complete', done === total);
        }

        function updateGlobalProgress() {
            let total = 0, done = 0;
            for (const day of ROUTINE) {
                for (const ex of day.ejercicios) {
                    total++;
                    if (getEx(ex.id).done) done++;
                }
            }
            const pct = total > 0 ? (done / total) * 100 : 0;
            const fill = document.getElementById('topbar-progress');
            if (fill) fill.style.width = pct + '%';
            const wi = document.getElementById('week-info');
            if (wi) wi.textContent = `Semana del ${fmtFecha(state.weekStart)} · ${done}/${total} completados`;
        }

        // ========== EVENTOS ==========
        container.addEventListener('change', (e) => {
            if (!e.target.classList.contains('ex-check')) return;
            const item = e.target.closest('.exercise-item');
            const id = item.dataset.id;
            getEx(id).done = e.target.checked;
            item.classList.toggle('checked', e.target.checked);
            if (e.target.checked) {
                item.classList.remove('just-checked');
                // Reflow para reiniciar la animación si se chequea de nuevo rápido
                void item.offsetWidth;
                item.classList.add('just-checked');
                setTimeout(() => item.classList.remove('just-checked'), 700);
            }
            updateDayProgress(id);
            updateGlobalProgress();
            saveState();
        });

        function autoCheckExercise(item) {
            const id = item.dataset.id;
            const ex = getEx(id);
            ex.done = true;
            item.classList.add('checked');
            const checkbox = item.querySelector('.ex-check');
            if (checkbox) checkbox.checked = true;
            item.classList.remove('just-checked');
            void item.offsetWidth;
            item.classList.add('just-checked');
            setTimeout(() => item.classList.remove('just-checked'), 700);
            updateDayProgress(id);
            updateGlobalProgress();
        }

        function copyLastSession(exId) {
            const last = getLastSession(exId);
            if (!last) return;
            const exDef = findExerciseDef(exId);
            if (!exDef) return;
            const ex = getEx(exId);
            const item = container.querySelector(`[data-id="${exId}"]`);
            if (!item) return;
            for (let i = 0; i < exDef.series; i++) {
                const prev = last.series[i];
                if (!prev) continue;
                if (!ex.series[i]) ex.series[i] = {};
                if (prev.peso != null) ex.series[i].peso = prev.peso;
                if (prev.reps != null) ex.series[i].reps = prev.reps;
                const pesoInput = item.querySelector(`.serie-peso[data-idx="${i}"]`);
                const repsInput = item.querySelector(`.serie-reps[data-idx="${i}"]`);
                if (pesoInput && prev.peso != null) pesoInput.value = prev.peso;
                if (repsInput && prev.reps != null) repsInput.value = prev.reps;
            }
            updateAllSeriesDiffs(item);
            saveState();
        }

        container.addEventListener('input', (e) => {
            const isPeso = e.target.classList.contains('serie-peso');
            const isReps = e.target.classList.contains('serie-reps');
            if (!isPeso && !isReps) return;
            const item = e.target.closest('.exercise-item');
            const ex = getEx(item.dataset.id);
            const exDef = findExerciseDef(item.dataset.id);
            const idx = parseInt(e.target.dataset.idx, 10);
            const wasComplete = isAllSeriesFilled(exDef, ex);

            if (!ex.series[idx]) ex.series[idx] = {};
            const raw = e.target.value;
            const val = raw === '' ? null : parseFloat(raw);
            ex.series[idx][isPeso ? 'peso' : 'reps'] = (Number.isFinite(val) ? val : null);

            const nowComplete = isAllSeriesFilled(exDef, ex);
            if (!wasComplete && nowComplete && !ex.done) {
                autoCheckExercise(item);
            }

            updateSingleSeriesDiff(item, idx);
            saveState();
        });

        function toggleExerciseExpand(item, forceOpen) {
            const detail = item.querySelector('.exercise-detail');
            const btn = item.querySelector('.btn-expand');
            const isHidden = detail.classList.contains('hidden');
            const willOpen = typeof forceOpen === 'boolean' ? forceOpen : isHidden;
            if (willOpen === !isHidden) return; // ya en el estado deseado

            if (willOpen) {
                container.querySelectorAll('.exercise-detail:not(.hidden)').forEach(d => {
                    if (d === detail) return;
                    d.classList.add('hidden');
                    const otherBtn = d.parentElement.querySelector('.btn-expand');
                    if (otherBtn) {
                        otherBtn.textContent = '▼';
                        otherBtn.setAttribute('aria-expanded', 'false');
                    }
                });
                detail.classList.remove('hidden');
                if (btn) { btn.textContent = '▲'; btn.setAttribute('aria-expanded', 'true'); }
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                detail.classList.add('hidden');
                if (btn) { btn.textContent = '▼'; btn.setAttribute('aria-expanded', 'false'); }
            }
        }

        function toggleDayCollapse(section, forceOpen) {
            const header = section.querySelector('.day-header[role="button"]');
            const content = section.querySelector('.day-content');
            if (!header || !content) return;
            const isCollapsed = section.classList.contains('collapsed');
            const willOpen = typeof forceOpen === 'boolean' ? forceOpen : isCollapsed;
            section.classList.toggle('collapsed', !willOpen);
            content.classList.toggle('hidden', !willOpen);
            header.setAttribute('aria-expanded', String(willOpen));
        }

        container.addEventListener('click', (e) => {
            // Colapso/expansión de día (no aplica a "hoy", que no tiene role=button)
            const dayHeader = e.target.closest('.day-header[role="button"]');
            if (dayHeader) {
                toggleDayCollapse(dayHeader.parentElement);
                return;
            }

            // Botón de descanso dentro del detalle
            if (e.target.classList.contains('btn-rest')) {
                startRest(parseInt(e.target.dataset.seconds, 10) || 90);
                return;
            }

            // Botón de copiar última sesión
            if (e.target.classList.contains('btn-copy-last')) {
                const item = e.target.closest('.exercise-item');
                if (item) copyLastSession(item.dataset.id);
                return;
            }

            // Expandir ejercicio: por click en el ▼ o tap en cualquier zona no interactiva de la card
            const item = e.target.closest('.exercise-item');
            if (!item) return;
            const isInteractiveZone = e.target.closest('.check-row, .exercise-detail');
            if (e.target.classList.contains('btn-expand') || !isInteractiveZone) {
                toggleExerciseExpand(item);
            }
        });

        container.addEventListener('keydown', (e) => {
            const dayHeader = e.target.closest('.day-header[role="button"]');
            if (!dayHeader) return;
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleDayCollapse(dayHeader.parentElement);
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm('¿Reiniciar el progreso de esta semana?\n(Se guardará en el historial para comparar pesos)')) {
                archiveAndReset();
                render();
                updateGlobalProgress();
                focusTodayFirstPending();
            }
        });

        // ========== IMPORT / EXPORT DE RUTINA ==========
        const hintEl = document.getElementById('data-hint');
        let hintResetTimer = null;
        function showHint(msg, type) {
            hintEl.textContent = msg;
            hintEl.classList.remove('is-error', 'is-success');
            if (type === 'error') hintEl.classList.add('is-error');
            if (type === 'success') hintEl.classList.add('is-success');
            if (hintResetTimer) clearTimeout(hintResetTimer);
            hintResetTimer = setTimeout(() => {
                hintEl.textContent = 'Exportá tu rutina como JSON, editala y reimportala. Tu progreso e historial no se borran.';
                hintEl.classList.remove('is-error', 'is-success');
            }, 6000);
        }

        function exportRoutine() {
            const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                routine: ROUTINE,
                cardio: CARDIO
            };
            try {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gym-rutina-${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showHint('Rutina exportada.', 'success');
            } catch (err) {
                showHint('No se pudo exportar: ' + err.message, 'error');
            }
        }

        function applyImportedRoutine(data) {
            try {
                localStorage.setItem(ROUTINE_KEY, JSON.stringify(data));
            } catch (err) {
                showHint('No se pudo guardar la rutina: ' + err.message, 'error');
                return;
            }
            ROUTINE = data.routine;
            CARDIO  = data.cardio || DEFAULT_CARDIO;
            render();
            updateGlobalProgress();
            focusTodayFirstPending();
            showHint(`Rutina importada (${ROUTINE.length} días).`, 'success');
        }

        function tryImportRoutineFromText(text) {
            let data;
            try {
                data = JSON.parse(text);
            } catch (err) {
                showHint('JSON inválido: ' + err.message, 'error');
                return false;
            }
            if (!isValidRoutineData(data)) {
                showHint('Formato inválido. Revisá días, IDs únicos y campos requeridos.', 'error');
                return false;
            }
            const summary = `${data.routine.length} día(s) y ${data.routine.reduce((n, d) => n + d.ejercicios.length, 0)} ejercicio(s)`;
            if (!confirm(`Reemplazar la rutina actual por la importada (${summary})?\n\nTu progreso semanal e historial no se borran. Si cambiaste IDs de ejercicios, su progreso puede no aparecer.`)) {
                return false;
            }
            applyImportedRoutine(data);
            return true;
        }

        function importRoutineFromFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => tryImportRoutineFromText(e.target.result);
            reader.onerror = () => showHint('No se pudo leer el archivo.', 'error');
            reader.readAsText(file);
        }

        function restoreDefaultRoutine() {
            if (!localStorage.getItem(ROUTINE_KEY)) {
                showHint('Ya estás usando la rutina por defecto.', 'success');
                return;
            }
            if (!confirm('Restaurar la rutina por defecto y descartar la importada?')) return;
            localStorage.removeItem(ROUTINE_KEY);
            ROUTINE = DEFAULT_ROUTINE;
            CARDIO  = DEFAULT_CARDIO;
            render();
            updateGlobalProgress();
            focusTodayFirstPending();
            showHint('Rutina por defecto restaurada.', 'success');
        }

        document.getElementById('btn-export').addEventListener('click', exportRoutine);
        const fileInput = document.getElementById('file-import');
        document.getElementById('btn-import').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            importRoutineFromFile(file);
            e.target.value = ''; // permite reimportar el mismo archivo
        });
        document.getElementById('btn-restore-default').addEventListener('click', restoreDefaultRoutine);

        const pasteToggle = document.getElementById('btn-paste-toggle');
        const pastePanel  = document.getElementById('paste-panel');
        const pasteArea   = document.getElementById('paste-area');
        function setPastePanelOpen(open) {
            pastePanel.classList.toggle('hidden', !open);
            pasteToggle.textContent = open ? '− Pegar JSON' : '+ Pegar JSON';
            pasteToggle.setAttribute('aria-expanded', String(open));
        }
        pasteToggle.addEventListener('click', () => {
            const willOpen = pastePanel.classList.contains('hidden');
            setPastePanelOpen(willOpen);
            if (willOpen) setTimeout(() => pasteArea.focus(), 60);
        });
        document.getElementById('btn-paste-apply').addEventListener('click', () => {
            const text = pasteArea.value.trim();
            if (!text) { showHint('Pegá un JSON primero.', 'error'); return; }
            if (tryImportRoutineFromText(text)) {
                pasteArea.value = '';
                setPastePanelOpen(false);
            }
        });

        // ========== TIMER DE DESCANSO (pastilla flotante) ==========
        const restPill   = document.getElementById('rest-pill');
        const restTimeEl = document.getElementById('rest-time');
        let restInterval = null;
        let restRemaining = 0;

        function fmtMMSS(s) {
            const safe = Math.max(0, s|0);
            const m = Math.floor(safe / 60);
            const sec = safe % 60;
            return `${m}:${String(sec).padStart(2, '0')}`;
        }

        function startRest(seconds) {
            restRemaining = seconds;
            restPill.classList.remove('done', 'hidden');
            paintRest();
            if (restInterval) clearInterval(restInterval);
            restInterval = setInterval(tickRest, 1000);
        }

        function tickRest() {
            restRemaining--;
            paintRest();
            if (restRemaining <= 0) {
                clearInterval(restInterval);
                restInterval = null;
                restPill.classList.add('done');
                if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
                beep();
            }
        }

        function paintRest() {
            restTimeEl.textContent = fmtMMSS(restRemaining);
        }

        function beep() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.7);
                osc.start();
                osc.stop(ctx.currentTime + 0.7);
            } catch {}
        }

        function closeRest() {
            if (restInterval) { clearInterval(restInterval); restInterval = null; }
            restPill.classList.add('hidden');
            restPill.classList.remove('done');
        }

        document.getElementById('rest-close').addEventListener('click', closeRest);
        restPill.addEventListener('click', (e) => {
            const delta = e.target.dataset && e.target.dataset.delta;
            if (!delta) return;
            restRemaining = Math.max(0, restRemaining + parseInt(delta, 10));
            if (restRemaining > 0 && !restInterval) {
                restPill.classList.remove('done');
                restInterval = setInterval(tickRest, 1000);
            }
            paintRest();
        });

        // ========== AUTO-EXPAND + SCROLL AL PRIMER PENDIENTE DE HOY ==========
        function focusTodayFirstPending() {
            const todayDow = new Date().getDay();
            const day = ROUTINE.find(d => d.dow === todayDow);
            if (!day) return; // viernes/finde: no es día de rutina
            const pending = day.ejercicios.find(e => !getEx(e.id).done);
            if (!pending) return; // ya está todo completo
            const item = container.querySelector(`[data-id="${pending.id}"]`);
            if (!item) return;
            toggleExerciseExpand(item, true);
            requestAnimationFrame(() => {
                setTimeout(() => {
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 250);
            });
        }

        // ========== INICIO ==========
        render();
        updateGlobalProgress();
        focusTodayFirstPending();

        // ========== SERVICE WORKER ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .then(reg => console.log('SW registrado:', reg.scope))
                    .catch(err => console.log('SW falló:', err));
            });
        }
    })();
    </script>
</body>
</html>
